spring.application.name=security-platform

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/security_platform
spring.datasource.username=sam
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# JWT
jwt.secret=change-this-secret-key-to-a-long-random-secret-key-123456789
jwt.expiration=3600000